services:
  backend:
    build:
      context: ./backend
      target: runtime
    image: lyftr-backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/app.db
      CACHE_DIR: /data/litellm_cache
    ports:
      - "8000:8000"
    volumes:
      - app_data:/data
    healthcheck:
      # python:3.12-slim has no curl, so probe /health with the standard library.
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    image: lyftr-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_data:
