# Netlify alternative to Vercel. In the Netlify UI set "Base directory" to `frontend`;
# this file then supplies the rest. Set VITE_API_BASE_URL in Site settings -> Environment variables.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: unknown paths serve the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
